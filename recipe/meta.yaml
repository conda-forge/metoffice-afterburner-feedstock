{% set name = "metoffice-afterburner" %}
{% set version = "1.3.4" %}
{% set sha256 = "ed2bf255316587d4cc7dd418a0e035fbe7b142d3d7861f610f6497b94b08a002" %}

package:
  name: {{ name|lower }}
  version: {{ version }}
The one that does work is files.pythonhosted.org/packages/bd/3a/1d3b357bfbcb4f28a9f064e4d94d24526994490a9a2aad54dd796577bbe4/metoffice_afterburner-1.3.4.tar.gz
source:
  url: https://pypi.org/project/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
  skip: True  # [win or osx]

requirements:
  host:
    - rsync
    - python
    - pip
    - setuptools
  run:
    - python
    - iris >=2.4
    - pyparsing >=2
    - windspharm

test:
  imports:
    - afterburner

about:
  home: https://code.metoffice.gov.uk/trac/afterburner
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.TXT
  summary: 'Tools and apps for processing numerical climate model data'
  description: |
    Afterburner is a Python package that provides functionality for analysing and
    processing climate model data, in particular, though not exclusively, data
    produced by the UK Met Office's Unified Model.
extra:
  recipe-maintainers:
    - ehogan
